name: CI

# Test gate for this repository. The URDF/xacro descriptions *are* the
# deliverable, so the gate validates them: every xacro expands, every URDF
# parses, every referenced mesh exists, and every XML file is well formed.
# Releases live in their own workflow (see .github/workflows/release.yml).
on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  # The job must be named `test`: that is the required status check.
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y liburdfdom-tools libxml2-utils
          python3 -m pip install --upgrade pip xacro

      - name: Expand every xacro and parse every URDF
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for f in **/*.xacro; do
            out="${f%.xacro}"
            [[ "$out" == *.urdf ]] || out="${out}.urdf"
            echo "xacro $f"
            xacro "$f" > "$out"
          done
          for f in **/*.urdf; do
            echo "check_urdf $f"
            check_urdf "$f" > /dev/null
          done
          for f in **/package.xml **/*.launch; do
            echo "xmllint $f"
            xmllint --noout "$f"
          done
          for f in **/*.launch.py; do
            echo "py_compile $f"
            python3 -m py_compile "$f"
          done

      - name: Check that every referenced mesh exists
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          packages = {}
          for manifest in Path(".").rglob("package.xml"):
              match = re.search(r"<name>\s*([^<\s]+)\s*</name>", manifest.read_text())
              if match:
                  packages[match.group(1)] = manifest.parent

          problems = []
          for urdf in Path(".").rglob("*.urdf"):
              for ref in re.findall(r'filename="([^"]+)"', urdf.read_text()):
                  if not ref.startswith("package://"):
                      continue
                  package, _, relative = ref[len("package://"):].partition("/")
                  root = packages.get(package)
                  if root is None:
                      problems.append(f"{urdf}: references unknown package {package}")
                  elif not (root / relative).exists():
                      problems.append(f"{urdf}: missing {ref}")

          print("\n".join(problems) if problems else "all referenced meshes exist")
          sys.exit(1 if problems else 0)
          PY

      - name: Check the single-actuator contract
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # The real gripper has one motor and one transmission. That must stay
          # visible in the expanded model: one commandable master joint, both
          # fingers mimicking it with the documented multiplier/offset, and a
          # ros2_control block that declares only the master joint.
          URDF = Path("litegrip_description/urdf/litegrip_description.urdf")
          MASTER = "gripper_opening_joint"
          FINGERS = ("gripper_slide_joint_right", "gripper_slide_joint_left")
          MULTIPLIER = -0.5

          root = ET.parse(URDF).getroot()
          joints = {j.get("name"): j for j in root.findall("joint")}
          problems = []

          def limit_bounds(joint, label):
              """The joint's numeric <limit lower/upper>, or None after recording why not."""
              limit = joint.find("limit")
              if limit is None:
                  problems.append(f"{label} has no <limit>")
                  return None
              bounds = {}
              for attr in ("lower", "upper"):
                  raw = limit.get(attr)
                  if raw is None:
                      problems.append(f"{label} <limit> has no {attr}")
                      continue
                  try:
                      bounds[attr] = float(raw)
                  except ValueError:
                      problems.append(f"{label} {attr} {raw!r} is not a number")
              return bounds

          def as_float(raw, what):
              try:
                  return float(raw)
              except (TypeError, ValueError):
                  problems.append(f"{what} {raw!r} is not a number")
                  return None

          master = joints.get(MASTER)
          if master is None:
              problems.append(f"missing master joint {MASTER}")
          elif master.get("type") != "prismatic":
              problems.append(f"{MASTER} is {master.get('type')}, expected prismatic")

          offset = None
          finger_limits = {}
          for finger in FINGERS:
              joint = joints.get(finger)
              if joint is None:
                  problems.append(f"missing finger joint {finger}")
                  continue
              mimic = joint.find("mimic")
              if mimic is None:
                  problems.append(f"{finger} is not a <mimic> follower")
                  continue
              if mimic.get("joint") != MASTER:
                  problems.append(f"{finger} mimics {mimic.get('joint')}, expected {MASTER}")
              multiplier = as_float(mimic.get("multiplier", "0"), f"{finger} multiplier")
              if multiplier is not None and abs(multiplier - MULTIPLIER) > 1e-9:
                  problems.append(f"{finger} multiplier is {mimic.get('multiplier')}, expected {MULTIPLIER}")
              finger_offset = as_float(mimic.get("offset", "0"), f"{finger} offset")
              if finger_offset is None:
                  continue
              if offset is None:
                  offset = finger_offset
              elif abs(finger_offset - offset) > 1e-9:
                  problems.append(f"{finger} offset {finger_offset} differs from {offset}")
              finger_limits[finger] = (limit_bounds(joint, finger), finger_offset)

          if master is not None and offset is not None:
              bounds = limit_bounds(master, MASTER)
              if bounds is not None:
                  if "lower" in bounds and abs(bounds["lower"]) > 1e-9:
                      problems.append(f"{MASTER} lower {bounds['lower']} is not 0")
                  if "upper" in bounds and abs(bounds["upper"] - 2.0 * offset) > 1e-9:
                      problems.append(f"{MASTER} upper {bounds['upper']} is not 2 x offset {offset}")

          # A finger's own limit must span exactly what its mimic law reaches:
          # q_finger = -0.5 * opening + offset with opening in [0, 2 * offset]
          # => q_finger in [0, offset]. If the limit drifts, the URDF admits
          # finger positions the mimic relation can never produce.
          for finger, (bounds, finger_offset) in finger_limits.items():
              if bounds is None:
                  continue
              if "lower" in bounds and abs(bounds["lower"]) > 1e-9:
                  problems.append(f"{finger} lower {bounds['lower']} is not 0")
              if "upper" in bounds and abs(bounds["upper"] - finger_offset) > 1e-9:
                  problems.append(
                      f"{finger} upper {bounds['upper']} is not its mimic offset {finger_offset}"
                  )

          blocks = root.findall("ros2_control")
          if len(blocks) != 1:
              problems.append(f"expected one <ros2_control> block, found {len(blocks)}")
          else:
              declared = {j.get("name") for j in blocks[0].findall("joint")}
              if declared != {MASTER}:
                  problems.append(
                      f"<ros2_control> declares {sorted(declared)}, expected [{MASTER}]"
                  )

          print("\n".join(problems) if problems else "single-actuator contract holds")
          sys.exit(1 if problems else 0)
          PY

      - name: Check composition with a host robot
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          description="$PWD/litegrip_description/urdf/litegrip_description.urdf.xacro"

          # A prefixed expansion must rename every link and the internal
          # footprint joint while leaving the controller joints untouched.
          xacro litegrip_description/urdf/litegrip_description.urdf.xacro \
            link_prefix:=litegrip_ > "$tmp/prefixed.urdf"
          check_urdf "$tmp/prefixed.urdf" > /dev/null

          # A host that already defines the usual base_link chain and a
          # base_footprint_joint must still compose and parse cleanly. This is
          # the case that failed before the footprint joint was prefixed.
          cat > "$tmp/host.urdf.xacro" <<EOF
          <?xml version="1.0"?>
          <robot name="host" xmlns:xacro="http://www.ros.org/wiki/xacro">
            <link name="base_footprint"/>
            <link name="base_link"/>
            <joint name="base_footprint_joint" type="fixed">
              <parent link="base_footprint"/>
              <child link="base_link"/>
            </joint>
            <xacro:include filename="$description"/>
            <joint name="mount_joint" type="fixed">
              <parent link="base_link"/>
              <child link="litegrip_base_footprint"/>
            </joint>
          </robot>
          EOF
          xacro "$tmp/host.urdf.xacro" link_prefix:=litegrip_ > "$tmp/host.urdf"
          check_urdf "$tmp/host.urdf" > /dev/null

          python3 - "$tmp/prefixed.urdf" "$tmp/host.urdf" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          LINKS = {
              "base_footprint",
              "base_link",
              "gripper_opening_link",
              "gripper_slider_link1",
              "gripper_slider_link2",
          }
          PREFIXED = {f"litegrip_{name}" for name in LINKS}
          CONTROLLER_JOINTS = {
              "gripper_opening_joint",
              "gripper_slide_joint_right",
              "gripper_slide_joint_left",
          }

          problems = []

          def names(root, tag):
              return [element.get("name") for element in root.findall(tag)]

          prefixed = ET.parse(Path(sys.argv[1])).getroot()
          links = set(names(prefixed, "link"))
          joints = set(names(prefixed, "joint"))
          if links != PREFIXED:
              problems.append(f"prefixed links are {sorted(links)}, expected {sorted(PREFIXED)}")
          if not CONTROLLER_JOINTS <= joints:
              problems.append(f"prefixed expansion lost controller joints: {sorted(CONTROLLER_JOINTS - joints)}")
          if "litegrip_base_footprint_joint" not in joints:
              problems.append("prefixed expansion is missing litegrip_base_footprint_joint")

          host = ET.parse(Path(sys.argv[2])).getroot()
          host_links = names(host, "link")
          host_joints = names(host, "joint")
          if len(host_links) != len(set(host_links)):
              problems.append("host composition has duplicate link names")
          if len(host_joints) != len(set(host_joints)):
              problems.append("host composition has duplicate joint names")
          if host_links.count("base_link") != 1:
              problems.append(
                  f"host composition has {host_links.count('base_link')} base_link links, expected 1"
              )
          if "litegrip_base_footprint_joint" not in host_joints:
              problems.append("host composition is missing litegrip_base_footprint_joint")

          print("\n".join(problems) if problems else "composition with a host robot holds")
          sys.exit(1 if problems else 0)
          PY
