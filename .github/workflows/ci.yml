name: CI

# Test gate for this repository. The URDF/xacro descriptions *are* the
# deliverable, so the gate validates them: every xacro expands, every URDF
# parses, every referenced mesh exists, and every XML file is well formed.
# Releases live in their own workflow (see .github/workflows/release.yml).
on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  # The job must be named `test`: that is the required status check.
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y liburdfdom-tools libxml2-utils
          python3 -m pip install --upgrade pip xacro

      - name: Expand every xacro and parse every URDF
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for f in **/*.xacro; do
            out="${f%.xacro}"
            [[ "$out" == *.urdf ]] || out="${out}.urdf"
            echo "xacro $f"
            xacro "$f" > "$out"
          done
          for f in **/*.urdf; do
            echo "check_urdf $f"
            check_urdf "$f" > /dev/null
          done
          for f in **/package.xml **/*.launch; do
            echo "xmllint $f"
            xmllint --noout "$f"
          done
          for f in **/*.launch.py; do
            echo "py_compile $f"
            python3 -m py_compile "$f"
          done

      - name: Check that every referenced mesh exists
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          packages = {}
          for manifest in Path(".").rglob("package.xml"):
              match = re.search(r"<name>\s*([^<\s]+)\s*</name>", manifest.read_text())
              if match:
                  packages[match.group(1)] = manifest.parent

          problems = []
          for urdf in Path(".").rglob("*.urdf"):
              for ref in re.findall(r'filename="([^"]+)"', urdf.read_text()):
                  if not ref.startswith("package://"):
                      continue
                  package, _, relative = ref[len("package://"):].partition("/")
                  root = packages.get(package)
                  if root is None:
                      problems.append(f"{urdf}: references unknown package {package}")
                  elif not (root / relative).exists():
                      problems.append(f"{urdf}: missing {ref}")

          print("\n".join(problems) if problems else "all referenced meshes exist")
          sys.exit(1 if problems else 0)
          PY

      - name: Check the single-actuator contract
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # The real gripper has one motor and one transmission. That must stay
          # visible in the expanded model: one commandable master joint, both
          # fingers mimicking it with the documented multiplier/offset, and a
          # ros2_control block that declares only the master joint.
          URDF = Path("litegrip_description/urdf/litegrip_description.urdf")
          MASTER = "gripper_opening_joint"
          FINGERS = ("gripper_slide_joint_right", "gripper_slide_joint_left")
          MULTIPLIER = -0.5

          root = ET.parse(URDF).getroot()
          joints = {j.get("name"): j for j in root.findall("joint")}
          problems = []

          master = joints.get(MASTER)
          if master is None:
              problems.append(f"missing master joint {MASTER}")
          elif master.get("type") != "prismatic":
              problems.append(f"{MASTER} is {master.get('type')}, expected prismatic")

          offset = None
          for finger in FINGERS:
              joint = joints.get(finger)
              if joint is None:
                  problems.append(f"missing finger joint {finger}")
                  continue
              mimic = joint.find("mimic")
              if mimic is None:
                  problems.append(f"{finger} is not a <mimic> follower")
                  continue
              if mimic.get("joint") != MASTER:
                  problems.append(f"{finger} mimics {mimic.get('joint')}, expected {MASTER}")
              if abs(float(mimic.get("multiplier", "0")) - MULTIPLIER) > 1e-9:
                  problems.append(f"{finger} multiplier is {mimic.get('multiplier')}, expected {MULTIPLIER}")
              finger_offset = float(mimic.get("offset", "0"))
              if offset is None:
                  offset = finger_offset
              elif abs(finger_offset - offset) > 1e-9:
                  problems.append(f"{finger} offset {finger_offset} differs from {offset}")

          if master is not None and offset is not None:
              upper = float(master.find("limit").get("upper"))
              if abs(upper - 2.0 * offset) > 1e-9:
                  problems.append(f"{MASTER} upper {upper} is not 2 x offset {offset}")

          blocks = root.findall("ros2_control")
          if len(blocks) != 1:
              problems.append(f"expected one <ros2_control> block, found {len(blocks)}")
          else:
              declared = {j.get("name") for j in blocks[0].findall("joint")}
              if declared != {MASTER}:
                  problems.append(
                      f"<ros2_control> declares {sorted(declared)}, expected [{MASTER}]"
                  )

          print("\n".join(problems) if problems else "single-actuator contract holds")
          sys.exit(1 if problems else 0)
          PY
